app = "hum-marion"
primary_region = "fra"

[build]

[env]
  HUM_ORIGIN = "https://hum-marion.fly.dev"
  HUM_OWNER_NAME = "Marion"
  HUM_DB_PATH = "/data/hum.sqlite"
  PORT = "3000"

[mounts]
  source = "hum_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/auth/status"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
